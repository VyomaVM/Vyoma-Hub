events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50G; # Support multi-gigabyte .vmif rootfs uploads

    upstream vyoma_api {
        server server:8080;
    }

    upstream vyoma_web {
        server web:3000;
    }

    server {
        listen 80;
        server_name localhost _;

        # OCI Registry v2 Distribution API
        location /v2/ {
            proxy_pass http://vyoma_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Docker-Distribution-API-Version;
            proxy_pass_header Docker-Content-Digest;
            proxy_pass_header Location;
            proxy_pass_header Range;
            proxy_pass_header Docker-Upload-UUID;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Vyoma Hub REST API v1
        location /api/ {
            proxy_pass http://vyoma_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health endpoint
        location /health {
            proxy_pass http://vyoma_api/health;
            proxy_http_version 1.1;
        }

        # Web Dashboard UI
        location / {
            proxy_pass http://vyoma_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
