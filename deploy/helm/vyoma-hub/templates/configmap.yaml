apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vyoma-hub.fullname" . }}-config
  labels:
    {{- include "vyoma-hub.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.global.appEnv | quote }}
  HOST: "0.0.0.0"
  PORT: {{ .Values.server.service.port | quote }}
  S3_ENDPOINT: {{ .Values.s3.endpoint | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  S3_REGION: {{ .Values.s3.region | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:%d/%s" .Values.postgresql.username .Values.postgresql.password .Values.postgresql.host (.Values.postgresql.port | int) .Values.postgresql.database | quote }}
  REDIS_URL: {{ printf "redis://%s:%d" .Values.redis.host (.Values.redis.port | int) | quote }}
  NEXT_PUBLIC_API_URL: {{ printf "https://%s/api/v1" .Values.global.domain | quote }}
