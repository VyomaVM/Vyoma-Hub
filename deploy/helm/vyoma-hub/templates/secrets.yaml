apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vyoma-hub.fullname" . }}-secrets
  labels:
    {{- include "vyoma-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  ARGON2_PEPPER: {{ .Values.secrets.argon2Pepper | quote }}
  S3_ACCESS_KEY: {{ .Values.s3.accessKey | quote }}
  S3_SECRET_KEY: {{ .Values.s3.secretKey | quote }}
