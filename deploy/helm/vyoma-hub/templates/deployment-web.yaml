apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vyoma-hub.fullname" . }}-web
  labels:
    {{- include "vyoma-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "vyoma-hub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "vyoma-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.web.service.port | quote }}
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: {{ printf "https://%s/api/v1" .Values.global.domain | quote }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
